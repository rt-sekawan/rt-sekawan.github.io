<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>E-Jimpitan - Masuk</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4CAF50">
  <link rel="icon" href="assets/icons/icon-192x192.png">
</head>
<body>
  <div class="login-container">
    <!-- LOGO RESPONSIF -->
    <div class="logo-wrapper">
      <img src="assets/icons/icon-512x512.png" alt="Logo E-Jimpitan" width="512" height="512" loading="lazy">
    </div>

    <form id="loginForm" autocomplete="on">
      <!-- FIELD USERNAME -->
      <input type="text" id="username" placeholder="Nama pengguna" required autocomplete="username">

      <!-- FIELD PASSWORD + TOMBOL TOGGLE -->
      <div class="password-field">
        <input type="password" id="password" placeholder="Kata sandi" required autocomplete="current-password">
        <span class="toggle-password" id="togglePassword" role="button" tabindex="0" aria-label="Tampilkan password">
          👁️
        </span>
      </div>

      <!-- REMEMBER ME (INGAT SAYA) -->
      <div class="remember-row">
        <input type="checkbox" id="rememberMe">
        <label for="rememberMe">Ingat saya</label>
      </div>

      <!-- TOMBOL LOGIN -->
      <button type="submit">LOGIN</button>
    </form>

    <!-- PESAN ERROR -->
    <p id="error"></p>
  </div>

  <!-- FILE JS EKSTERNAL (urutan penting: api.js -> app.js -> auth.js) -->
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
