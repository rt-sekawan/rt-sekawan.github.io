<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Data User</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
  <div class="container">
    <div class="top-actions">
      <button onclick="location.href='dashboard.html'">← Kembali</button>
    </div>
    <h2>Data User</h2>

    <div class="card">
      <h3>Tambah / Edit User</h3>
      <form id="userForm">
        <input type="hidden" id="user_id_field">
        <input type="hidden" id="warga_id_field">

        <label>Nama (pilih dari Data Warga)</label>
        <div class="search-box">
          <input type="text" id="wargaSearch" placeholder="Ketik nama atau nomor rumah warga..." autocomplete="off" required>
          <div id="wargaSearchResults" class="search-results"></div>
        </div>
        <p class="hint" id="wargaSelectedInfo">Ketik minimal 1 huruf untuk mencari warga.</p>

        <label>Username</label>
        <input type="text" id="username" placeholder="Username" required>

        <label id="passwordLabel">Password</label>
        <input type="password" id="password" placeholder="Password" required>

        <label>Role</label>
        <select id="role">
          <option value="USER">WARGA</option>
          <option value="BENDAHARA">BENDAHARA</option>
          <option value="ADMIN">ADMIN</option>
        </select>

        <label>Status</label>
        <select id="status">
          <option value="ACTIVE">ACTIVE</option>
          <option value="INACTIVE">INACTIVE</option>
        </select>

        <button type="submit">Simpan</button>
        <button type="button" onclick="resetUserForm()">Batal</button>
      </form>
    </div>

    <div class="card">
      <h3>Daftar User</h3>
      <input type="text" id="userTableFilter" placeholder="Cari di daftar user...">
      <table id="userTable">
        <thead><tr><th>Username</th><th>Nama Warga</th><th>Role</th><th>Status</th><th>Login Terakhir</th><th>Aksi</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <nav>
      <a href="warga.html">Data Warga</a>
      <a href="users.html">Data User</a>
    </nav>
  </div>

  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/admin-users.js"></script>
</body>
</html>
