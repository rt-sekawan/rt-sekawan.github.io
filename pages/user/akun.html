<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Akun Saya</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
  <div class="container">
    <div class="top-actions">
      <button onclick="location.href='dashboard.html'">← Kembali</button>
      <button onclick="logout()" class="danger">Keluar</button>
    </div>
    <h2>Akun Saya</h2>
    
    <div class="card">
      <h3>Informasi</h3>
      <p><strong>Nama:</strong> <span id="namaUser"></span></p>
      <p><strong>Nomor Rumah:</strong> <span id="nomorRumah"></span></p>
      <p><strong>Role:</strong> <span id="roleUser"></span></p>
    </div>
    
    <div class="card">
      <h3>Keuangan</h3>
      <p>Saldo Deposit: <span id="saldoDeposit">Rp0</span></p>
      <p>Total Hutang: <span id="totalHutang">Rp0</span></p>
    </div>
    
    <div class="card">
      <h3>Riwayat Tugas</h3>
      <table id="riwayatTable">
        <thead>
          <tr><th>Tanggal</th><th>Status</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    
    <div class="card">
      <h3>Pengaturan Tampilan</h3>
      <button onclick="toggleTheme()">☀/🌙 Ganti Tema</button>
    </div>
  </div>
  
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/user-akun.js"></script>
</body>
</html>
