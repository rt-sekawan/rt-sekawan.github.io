<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Jadwal</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
  <div class="container">
    <h2>Kelola Jadwal</h2>
    
    <div class="card">
      <label>Tahun</label>
      <input type="number" id="tahun" value="2026">
      
      <button onclick="generateJadwal()">Generate Jadwal</button>
    </div>
    
    <div class="card">
      <h3>Regenerate Jadwal</h3>
      <label>Mulai Tanggal</label>
      <input type="date" id="mulaiTanggal">
      <button onclick="regenerateJadwal()">Regenerate</button>
    </div>
    
    <div class="card">
      <h3>Lihat Jadwal</h3>
      <label>Tanggal</label>
      <input type="date" id="tanggalFilter">
      <button onclick="loadJadwal()">Tampilkan</button>
      
      <table id="jadwalTable">
        <thead>
          <tr><th>Tanggal</th><th>Petugas</th><th>Status</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    
    <button onclick="location.href='dashboard.html'">Kembali</button>
  </div>
  
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/admin-jadwal.js"></script>
</body>
</html>
