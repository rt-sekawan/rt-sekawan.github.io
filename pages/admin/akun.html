<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Akun Admin</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
  <div class="container">
    <div class="top-actions">
      <button onclick="location.href='dashboard.html'">← Kembali</button>
      <button onclick="logout()" class="danger">Keluar</button>
    </div>
    <h2>Akun Admin</h2>
    
    <div class="card">
      <h3>Informasi</h3>
      <p><strong>Nama:</strong> <span id="namaUser"></span></p>
      <p><strong>Role:</strong> ADMIN</p>
    </div>
    
    <div class="card">
      <h3>Pengaturan Tampilan</h3>
      <button onclick="toggleTheme()">☀/🌙 Ganti Tema</button>
    </div>
  </div>
  
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script>
    const user = checkAuth();
    if (user) {
      document.getElementById('namaUser').textContent = user.username;
    }
  </script>
</body>
</html>
