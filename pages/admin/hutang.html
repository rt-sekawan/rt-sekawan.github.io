<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bayar Hutang</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
  <div class="container">
    <div class="top-actions">
      <button onclick="location.href='dashboard.html'">← Kembali</button>
    </div>
    <h2>Bayar Hutang</h2>

    <div class="card">
      <h3>Form Pembayaran Hutang</h3>
      <form id="hutangForm">
        <label>Tanggal Bayar</label>
        <input type="date" id="tanggal" required>

        <label>Nama Warga</label>
        <div class="search-box">
          <input type="text" id="wargaSearch" placeholder="Ketik nama atau nomor rumah warga..." autocomplete="off" required>
          <div id="wargaSearchResults" class="search-results"></div>
        </div>
        <input type="hidden" id="warga_id_field">

        <label>ID Warga</label>
        <input type="text" id="idWargaDisplay" disabled placeholder="Otomatis terisi setelah pilih warga">

        <label>Nomor Rumah</label>
        <input type="text" id="nomorRumahDisplay" disabled placeholder="Otomatis terisi setelah pilih warga">

        <div class="info" id="sisaHutangInfo" style="display:none;">
          <p>Sisa Hutang Warga Ini: <span id="sisaHutangValue">Rp0</span></p>
        </div>

        <label>Kepada Siapa Bayarnya</label>
        <input type="text" id="diterimaOleh" placeholder="Nama penerima pembayaran, mis. Bendahara RT">

        <label>Besar Bayar (Rp)</label>
        <input type="number" id="jumlah" min="1" placeholder="Masukkan nominal yang dibayar" required>
        <p class="hint">Kalau jumlah bayar melebihi sisa hutang, kelebihannya otomatis jadi saldo deposit warga.</p>

        <button type="submit">Simpan</button>
        <button type="button" onclick="resetHutangForm()">Batal</button>
      </form>
    </div>

    <div class="card">
      <h3>Riwayat Bayar Hutang</h3>
      <input type="text" id="riwayatFilter" placeholder="Cari nama warga di riwayat...">
      <table id="riwayatTable">
        <thead><tr><th>Tanggal</th><th>Nama</th><th>Rumah</th><th>Nominal</th><th>Keterangan</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/bayar-hutang.js"></script>
</body>
</html>
