<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>Jimpitan Desa - Login</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4CAF50">
  <link rel="icon" href="assets/icons/icon-192x192.png">
</head>
<body>
  <div class="login-container">
    <!-- LOGO RESPONSIF - Pengganti teks "JIMPITAN DESA" -->
    <div class="logo-wrapper">
      <img src="assets/icons/icon-512x512.png" alt="Jimpitan Desa" width="512" height="512" loading="lazy">
    </div>

    <form id="loginForm" autocomplete="on">
      <!-- FIELD USERNAME -->
      <input type="text" id="username" placeholder="Username" required autocomplete="username">

      <!-- FIELD PASSWORD + TOMBOL TOGGLE -->
      <div class="password-field">
        <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
        <button type="button" class="toggle-password" id="togglePassword" aria-label="Tampilkan atau sembunyikan password">
          👁️
        </button>
      </div>

      <!-- REMEMBER ME (INGAT SAYA) -->
      <div class="remember-row">
        <input type="checkbox" id="rememberMe">
        <label for="rememberMe">Ingat saya</label>
      </div>

      <!-- TOMBOL LOGIN -->
      <button type="submit">LOGIN</button>
    </form>

    <!-- PESAN ERROR -->
    <p id="error"></p>
  </div>

  <!-- JAVASCRIPT KHUSUS UNTUK TOGGLE PASSWORD DAN REMEMBER ME -->
  <script>
    (function() {
      // =============================================
      // 1. AMBIL REFERENSI ELEMEN
      // =============================================
      const loginForm = document.getElementById('loginForm');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const rememberCheck = document.getElementById('rememberMe');
      const errorEl = document.getElementById('error');
      const toggleBtn = document.getElementById('togglePassword');

      // =============================================
      // 2. FITUR TOGGLE PASSWORD (View/Hide)
      // =============================================
      toggleBtn.addEventListener('click', function(e) {
        e.preventDefault();
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        toggleBtn.textContent = isPassword ? '🙈' : '👁️';
      });

      // =============================================
      // 3. FITUR INGAT SAYA (LOAD SAVED CREDENTIALS)
      // =============================================
      function loadSavedCredentials() {
        try {
          const saved = localStorage.getItem('jimpitan_remember');
          if (saved) {
            const data = JSON.parse(saved);
            if (data.username && data.password) {
              usernameInput.value = data.username;
              passwordInput.value = data.password;
              rememberCheck.checked = true;
            }
          }
        } catch (_) {
          // ignore
        }
      }
      loadSavedCredentials();

      // =============================================
      // 4. SIMPAN CREDENTIALS SAAT LOGIN (TANPA SIMULASI)
      // =============================================
      loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();

        // Validasi kosong
        if (!username || !password) {
          errorEl.textContent = 'Username dan password wajib diisi.';
          errorEl.style.color = 'var(--danger)';
          return;
        }

        // Simpan "Ingat Saya" jika dicentang
        if (rememberCheck.checked) {
          try {
            localStorage.setItem('jimpitan_remember', JSON.stringify({
              username: username,
              password: password
            }));
          } catch (_) { /* ignore */ }
        } else {
          // Hapus data tersimpan jika tidak dicentang
          localStorage.removeItem('jimpitan_remember');
        }

        // Hapus pesan error
        errorEl.textContent = '';
        
        // FORM SUBMIT LANJUT KE PROSES LOGIN YANG SEBENARNYA
        // (akan diproses oleh auth.js atau file eksternal lainnya)
        loginForm.submit();
      });

      // =============================================
      // 5. HAPUS ERROR SAAT USER MULAI MENGETIK
      // =============================================
      usernameInput.addEventListener('input', function() {
        errorEl.textContent = '';
      });
      passwordInput.addEventListener('input', function() {
        errorEl.textContent = '';
      });

    })();
  </script>

  <!-- FILE JS EKSTERNAL (auth.js untuk proses login sebenarnya) -->
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
