<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>E-Jimpitan - Masuk</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4CAF50">
  <link rel="icon" href="assets/icons/icon-192x192.png">
</head>
<body>
  <div class="login-container">
    <!-- LOGO RESPONSIF -->
    <div class="logo-wrapper">
      <img src="assets/icons/icon-512x512.png" alt="Logo E-Jimpitan" width="512" height="512" loading="lazy">
    </div>

    <!-- TAB: Masuk / Informasi Warga -->
    <div class="tab-switch">
      <button type="button" class="tab-btn active" id="tabMasukBtn">Masuk</button>
      <button type="button" class="tab-btn" id="tabInfoBtn">Informasi Warga</button>
    </div>

    <!-- TAB MASUK -->
    <div id="tabMasuk">
      <form id="loginForm" autocomplete="on">
        <!-- FIELD USERNAME -->
        <input type="text" id="username" placeholder="Nama pengguna" required autocomplete="username">
        <!-- FIELD PASSWORD + TOMBOL TOGGLE -->
        <div class="password-field">
          <input type="password" id="password" placeholder="Kata sandi" required autocomplete="current-password">
          <span class="toggle-password" id="togglePassword" role="button" tabindex="0" aria-label="Tampilkan password">
            👁️
          </span>
        </div>
        <!-- REMEMBER ME (INGAT SAYA) -->
        <div class="remember-row">
          <input type="checkbox" id="rememberMe">
          <label for="rememberMe">Ingat saya</label>
        </div>
        <!-- TOMBOL LOGIN -->
        <button type="submit">Masuk</button>
      </form>
      <!-- PESAN ERROR -->
      <p id="error"></p>
    </div>

    <!-- TAB INFORMASI WARGA (publik, tanpa login) -->
    <div id="tabInfo" style="display:none;">
      <div class="info-grid">
        <div class="info-box">
          <div class="info-label">📊 Total Warga</div>
          <div class="info-value" id="infoTotalWarga">-</div>
        </div>
        <div class="info-box">
          <div class="info-label">📅 Jadwal Hari Ini</div>
          <div class="info-value" id="infoJadwalHariIni">-</div>
        </div>
        <div class="info-box">
          <div class="info-label">✅ Kehadiran Bulan Ini</div>
          <div class="info-value" id="infoKehadiran">-</div>
        </div>
      </div>

      <h3 class="info-section-title">📋 Jadwal 10 Hari Kedepan</h3>
      <table id="infoJadwalTable">
        <thead><tr><th>Tanggal</th><th>Petugas</th></tr></thead>
        <tbody><tr><td colspan="2">Memuat...</td></tr></tbody>
      </table>
    </div>
  </div>
  <!-- FILE JS EKSTERNAL (urutan penting: api.js -> app.js -> auth.js) -->
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/info-publik.js"></script>
</body>
</html>
